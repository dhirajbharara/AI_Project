# =============================================================================
# CI Pipeline — runs on every push and pull request
#
# Stages: Build → Unit Test → Security Scan → Docker Build → Push Registry
# =============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Model Packaging
  # ---------------------------------------------------------------------------
  package-model:
    name: "1. Model Packaging"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package model manifest
        run: |
          chmod +x scripts/package-model.sh
          ./scripts/package-model.sh
        env:
          MODEL_NAME: llama3.2:1b
          MODEL_VERSION: ${{ github.sha }}

      - name: Upload model package
        uses: actions/upload-artifact@v4
        with:
          name: model-package
          path: model-packages/

  # ---------------------------------------------------------------------------
  # Stage 2: Unit Tests
  # ---------------------------------------------------------------------------
  unit-test:
    name: "2. Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Stage 3: Security Scan (SAST + dependency check)
  # ---------------------------------------------------------------------------
  security-scan:
    name: "3. Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r app/ -ll

  # ---------------------------------------------------------------------------
  # Stage 4: Docker Build
  # ---------------------------------------------------------------------------
  docker-build:
    name: "4. Docker Build"
    runs-on: ubuntu-latest
    needs: [unit-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 5: Image Scan + Push Registry
  # ---------------------------------------------------------------------------
  push-registry:
    name: "5. Image Scan & Push"
    runs-on: ubuntu-latest
    needs: [docker-build, package-model]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Scan pushed image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: 1
