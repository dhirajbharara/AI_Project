# =============================================================================
# On-Premises GPU Server Deployment
#
# Provisions on-prem GPU cluster via Terraform + Ansible with NVIDIA/CUDA setup
# =============================================================================
name: Deploy — On-Prem GPU

on:
  workflow_dispatch:
    inputs:
      gpu_layers:
        description: "Number of GPU layers to offload"
        required: false
        default: "35"

env:
  CONTAINER_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  terraform-onprem:
    name: "Terraform — On-Prem Registration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Register on-prem nodes
        working-directory: terraform/environments/onprem
        run: |
          terraform init
          terraform plan
          # terraform apply -auto-approve  # Enable with SSH key secret
          echo "On-prem nodes registered (dry-run in CI)"

  ansible-gpu-setup:
    name: "Ansible — GPU Setup"
    runs-on: ubuntu-latest
    needs: terraform-onprem
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible + collections
        run: |
          pip install ansible docker
          ansible-galaxy collection install community.docker

      - name: Configure GPU nodes
        run: |
          ansible-playbook \
            -i ansible/inventory/onprem.yml \
            ansible/playbooks/site.yml \
            --limit onprem_gpu \
            -e "container_image=${{ env.CONTAINER_IMAGE }}" \
            -e "hardware_type=gpu" \
            -e "gpu_layers=${{ inputs.gpu_layers }}" \
            -e "deployment_target=onprem-gpu" \
            -e "model_version=${{ github.sha }}"
        continue-on-error: true  # Requires actual on-prem SSH access

  deploy-gpu:
    name: "Deploy to GPU Cluster"
    runs-on: ubuntu-latest
    needs: ansible-gpu-setup
    steps:
      - uses: actions/checkout@v4

      - name: Rolling deploy to GPU nodes
        run: |
          chmod +x scripts/rollout.sh
          ./scripts/rollout.sh ansible/inventory/onprem.yml
        env:
          CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}
          MODEL_VERSION: ${{ github.sha }}
        continue-on-error: true

  validate-gpu:
    name: "GPU Validation"
    runs-on: ubuntu-latest
    needs: deploy-gpu
    steps:
      - uses: actions/checkout@v4

      - name: Validate GPU deployment
        run: |
          chmod +x scripts/validate-deployment.sh scripts/detect-hardware.sh
          HARDWARE=$(./scripts/detect-hardware.sh)
          echo "Local hardware: ${HARDWARE}"
          ./scripts/validate-deployment.sh "http://192.168.10.11:8000" || echo "Skipped — requires on-prem network"
        env:
          MAX_LATENCY_MS: 15000  # GPU should be faster

  update-manifest:
    name: "Update Manifest"
    runs-on: ubuntu-latest
    needs: validate-gpu
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        run: |
          chmod +x scripts/generate-manifest.sh
          ./scripts/generate-manifest.sh
        env:
          DEPLOYMENT_TARGET: onprem-gpu
          HARDWARE_TYPE: gpu
          ENVIRONMENT: production
          MODEL_VERSION: ${{ github.sha }}
          API_ENDPOINT: http://192.168.10.11:8000
          CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}

  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: update-manifest
    if: success()
    steps:
      - run: echo "✅ On-prem GPU deployment complete"
