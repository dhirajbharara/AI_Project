global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Local LLM API metrics
  - job_name: llm-api-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - llm-api:8000
        labels:
          service: llm-inference
          environment: local

  # Prometheus self-metrics
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
