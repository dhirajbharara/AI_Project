# Prometheus configuration — scrapes LLM API and host metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # LLM inference API metrics
  - job_name: llm-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - llm-region-a-01:8000
          - llm-region-a-02:8000
          - llm-region-b-01:8000
          - gpu-node-01:8000
          - gpu-node-02:8000
        labels:
          service: llm-inference

  # Host metrics (CPU, memory, disk)
  - job_name: node-exporter
    static_configs:
      - targets:
          - llm-region-a-01:9100
          - llm-region-a-02:9100
          - gpu-node-01:9100
          - gpu-node-02:9100

  # GPU metrics (NVIDIA DCGM)
  - job_name: dcgm-exporter
    static_configs:
      - targets:
          - gpu-node-01:9400
          - gpu-node-02:9400

  # CI/CD pipeline metrics (GitHub Actions exporter)
  - job_name: github-actions
    static_configs:
      - targets:
          - prometheus-pushgateway:9091
